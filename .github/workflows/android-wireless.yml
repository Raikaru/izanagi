name: android-wireless-device

on:
  workflow_dispatch:
    inputs:
      adb_pair_address:
        description: "Pairing address shown by Wireless debugging (host:pairing-port)"
        required: true
        type: string
      adb_pairing_code:
        description: "Six-digit Wi-Fi pairing code shown by Android"
        required: true
        type: string
      adb_device_address:
        description: "ADB connect address shown by Wireless debugging (host:debug-port)"
        required: true
        type: string
      run_gpu_tests:
        description: "Also run the Vulkan API suite on the attached device"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-wireless-device
  cancel-in-progress: false

jobs:
  android-wireless:
    # The runner must be Linux, self-hosted, and on the same LAN/VPN as the phone.
    runs-on: [self-hosted, linux, android-device]
    timeout-minutes: 30
    env:
      ANDROID_API: android-26
      ANDROID_ABI: arm64-v8a
      BUILD_DIR: build-android-device
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Configure Android test binaries
        shell: bash
        run: >
          cmake -S . -B "$BUILD_DIR" -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI="$ANDROID_ABI" -DANDROID_PLATFORM="$ANDROID_API"
          -DIZANAGI_BACKEND=VULKAN_NATIVE -DIZANAGI_VK_PROFILE=BINDLESS
          -DIZANAGI_WSI=ANDROID -DIZANAGI_BUILD_TESTS=ON
          -DIZANAGI_BUILD_EXAMPLES=OFF -DIZANAGI_BUILD_CAPABILITY_REPORT=OFF
      - name: Build Android test binaries
        run: cmake --build "$BUILD_DIR" --parallel
      - name: Pair and connect the Android device
        shell: bash
        env:
          ADB_PAIR_ADDRESS: ${{ inputs.adb_pair_address }}
          ADB_PAIRING_CODE: ${{ inputs.adb_pairing_code }}
          ADB_DEVICE_ADDRESS: ${{ inputs.adb_device_address }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADB_PAIRING_CODE"
          echo "::add-mask::$ADB_PAIR_ADDRESS"
          echo "::add-mask::$ADB_DEVICE_ADDRESS"
          adb start-server
          adb pair "$ADB_PAIR_ADDRESS" "$ADB_PAIRING_CODE"
          adb connect "$ADB_DEVICE_ADDRESS"
          adb -s "$ADB_DEVICE_ADDRESS" wait-for-device
          adb -s "$ADB_DEVICE_ADDRESS" get-state
      - name: Push test binary and shader artifacts
        shell: bash
        env:
          ADB_DEVICE_ADDRESS: ${{ inputs.adb_device_address }}
        run: |
          set -euo pipefail
          shader_dir="$(find "$BUILD_DIR/bin" -type d -name shaders -print -quit)"
          test -n "$shader_dir"
          adb -s "$ADB_DEVICE_ADDRESS" push "$BUILD_DIR/bin/izanagi_common_tests" /data/local/tmp/izanagi_common_tests
          adb -s "$ADB_DEVICE_ADDRESS" push "$shader_dir" /data/local/tmp/
          if [ "${{ inputs.run_gpu_tests }}" = "true" ]; then
            adb -s "$ADB_DEVICE_ADDRESS" push "$BUILD_DIR/bin/izanagi_tests" /data/local/tmp/izanagi_tests
          fi
      - name: Run common tests on Android
        shell: bash
        env:
          ADB_DEVICE_ADDRESS: ${{ inputs.adb_device_address }}
        run: |
          set -euo pipefail
          adb -s "$ADB_DEVICE_ADDRESS" shell chmod 755 /data/local/tmp/izanagi_common_tests
          adb -s "$ADB_DEVICE_ADDRESS" shell 'cd /data/local/tmp && ./izanagi_common_tests'
      - name: Run Vulkan API tests on Android (opt-in)
        if: ${{ inputs.run_gpu_tests }}
        shell: bash
        env:
          ADB_DEVICE_ADDRESS: ${{ inputs.adb_device_address }}
        run: |
          set -euo pipefail
          adb -s "$ADB_DEVICE_ADDRESS" shell chmod 755 /data/local/tmp/izanagi_tests
          adb -s "$ADB_DEVICE_ADDRESS" shell 'cd /data/local/tmp && ./izanagi_tests'
      - name: Collect Android diagnostics on failure
        if: ${{ failure() }}
        shell: bash
        env:
          ADB_DEVICE_ADDRESS: ${{ inputs.adb_device_address }}
        run: |
          adb -s "$ADB_DEVICE_ADDRESS" shell getprop ro.build.version.release || true
          adb -s "$ADB_DEVICE_ADDRESS" shell getprop ro.product.model || true
          adb -s "$ADB_DEVICE_ADDRESS" shell dumpsys SurfaceFlinger || true
          adb -s "$ADB_DEVICE_ADDRESS" shell dumpsys media.vulkan || true
