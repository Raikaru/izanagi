name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-debug:
    # windows-latest moved to VS 18 2026; the dev-windows-msvc preset
    # targets VS 17 2022, so pin the image that still ships it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        run: cmake -S . -B build --preset dev-windows-msvc
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        env:
          IZANAGI_TESTS_ALLOW_SKIP: 1
        run: ctest --test-dir build -C Debug --output-on-failure

  linux-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure (Clang Debug, headless)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DIZANAGI_WSI=HEADLESS -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Test (common tests run for real; GPU tests skip)
        env:
          IZANAGI_TESTS_ALLOW_SKIP: 1
        run: ctest --test-dir build --output-on-failure

  linux-arm64-native:
    # Native ARM64 Linux build + GPU-independent tests on GitHub's free arm64
    # runners. The phone used to be the only ARM64 Linux builder; it is now a
    # GPU test device only, so this job holds that coverage.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure (Clang Release, headless)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DIZANAGI_WSI=HEADLESS -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Test (GPU-independent)
        run: ./build/bin/izanagi_common_tests

  linux-gcc-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure (GCC Release, headless)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DIZANAGI_WSI=HEADLESS -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Build common tests (compile + run)
        run: |
          cmake --build build --target izanagi_common_tests
          ./build/bin/izanagi_common_tests

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure (AppleClang, headless, no slangc needed)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DIZANAGI_WSI=HEADLESS -DIZANAGI_BUILD_TESTS=OFF
          -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build

  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CONFIGURATION_TYPES=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        env:
          IZANAGI_TESTS_ALLOW_SKIP: 1
        run: ctest --test-dir build -C Release --output-on-failure


  linux-lavapipe-bindless:
    # Hardware-light validation: the full Bindless suite on Lavapipe (CPU
    # Vulkan, no GPU needed). NON-AUTHORITATIVE: the capability probe runs
    # first and the job SKIPS (never fails) when Lavapipe cannot run the
    # profile — real-hardware qualification is the separate
    # tools/run_hardware_qualification.sh bundle + issue template.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Configure (Bindless, headless, Debug)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DIZANAGI_WSI=HEADLESS -DIZANAGI_VK_PROFILE=BINDLESS
          -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build
      - name: Probe (capability report; non-authoritative)
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d /usr/lib/x86_64-linux-gnu -name 'lvp_icd*.json' 2>/dev/null | head -n 1)
          if [ -z "$icd" ]; then
            echo "ERROR: Lavapipe ICD not found (mesa-vulkan-drivers install?). Available ICDs:" >&2
            ls -l /usr/share/vulkan/icd.d/ 2>&1 >&2 || true
            exit 1
          fi
          # Pin the Lavapipe ICD so the probe and the suite use Lavapipe, not
          # whatever ICD the loader would otherwise pick on the runner.
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          set +e
          ./build/bin/izanagi_capability_report > /tmp/lavapipe-cap.json 2>/tmp/lavapipe-cap.err
          status=$?
          set -e
          cat /tmp/lavapipe-cap.json
          if [ $status -ne 0 ]; then
            if grep -q '"profile_supported": false' /tmp/lavapipe-cap.json; then
              echo "Lavapipe cannot run the bindless profile — skipping (non-authoritative)."
              exit 0
            fi
            echo "ERROR: capability probe failed ($status) without a profile_supported:false" >&2
            echo "       decision — malformed JSON or tool crash. Probe stderr:" >&2
            cat /tmp/lavapipe-cap.err >&2
            exit 1
          fi
          if ! grep -q '"profile_supported": true' /tmp/lavapipe-cap.json; then
            echo "ERROR: probe exited 0 without profile_supported:true (malformed JSON?)" >&2
            exit 1
          fi
          echo "PROFILE_QUALIFIED=1" >> "$GITHUB_ENV"
      - name: Test (full suite on Lavapipe)
        if: env.PROFILE_QUALIFIED == '1'
        env:
          IZANAGI_TESTS_ALLOW_SKIP: 1
        run: ctest --test-dir build --output-on-failure
      - name: Archive capability evidence
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: lavapipe-capability
          path: /tmp/lavapipe-cap.json

  android-arm64-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Configure (Android arm64, bindless, no host tests)
        shell: bash
        run: >
          cmake -S . -B build-android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          -DIZANAGI_BACKEND=VULKAN_NATIVE -DIZANAGI_VK_PROFILE=BINDLESS
          -DIZANAGI_WSI=ANDROID -DIZANAGI_BUILD_TESTS=OFF
          -DIZANAGI_BUILD_EXAMPLES=OFF -DIZANAGI_BUILD_CAPABILITY_REPORT=OFF
      - name: Build Android static library
        run: cmake --build build-android --parallel
      - name: Verify Android artifact
        shell: bash
        run: test -f build-android/lib/libizanagi.a

  consumer-integration:
    # Stranger test: install a built Izanagi and consume it via
    # find_package exactly as an external project would. Proves the
    # install/export path (IzanagiConfig + IzanagiTargets) on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure (headless, install-ready)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/izanagi-prefix
          -DIZANAGI_WSI=HEADLESS -DIZANAGI_BUILD_TESTS=OFF
          -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build and install
        run: |
          cmake --build build
          cmake --install build
      - name: Configure consumer project
        run: |
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(izanagi_consumer CXX)
          find_package(Izanagi CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE Izanagi::izanagi)
          EOF
          cat > /tmp/consumer/main.cpp <<'EOF'
          #include <izanagi/gpu.h>
          int main() {
              gpu::DeviceDesc desc{};
              desc.log_level = gpu::LogLevel::Off;
              gpu::Device d = gpu::create_device(desc);
              if (d != nullptr) { gpu::destroy_device(d); }
              return 0;
          }
          EOF
          cmake -S /tmp/consumer -B /tmp/consumer/build -G Ninja \
                -DCMAKE_PREFIX_PATH=${{ runner.temp }}/izanagi-prefix
      - name: Build consumer
        run: cmake --build /tmp/consumer/build

  linux-wsi-build:
    # Compiles the Wayland and XCB surface paths against the real platform
    # headers. Build-only: no display server on the runner, so no surface is
    # ever created here — this guards the WSI code against bitrot, not the
    # presentation path (which needs the qualification rig).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install WSI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxcb1-dev
      - name: Configure (Wayland)
        run: >
          cmake -S . -B build-wayland -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DIZANAGI_WSI=WAYLAND -DIZANAGI_BUILD_TESTS=OFF
          -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build (Wayland)
        run: cmake --build build-wayland
      - name: Configure (XCB)
        run: >
          cmake -S . -B build-xcb -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DIZANAGI_WSI=XCB -DIZANAGI_BUILD_TESTS=OFF
          -DIZANAGI_BUILD_EXAMPLES=OFF
      - name: Build (XCB)
        run: cmake --build build-xcb
