name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # windows-latest moved to VS 18 2026; the dev-windows-msvc preset
    # targets VS 17 2022, so pin the image that still ships it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build --preset dev-windows-msvc
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        env:
          IZANAGI_TESTS_ALLOW_SKIP: 1
        run: ctest --test-dir build -C Debug --output-on-failure
